# ============================================================
# src/main/resources/application.properties
# 小半天旅遊 AI 推薦平台（含 AR YOLO 知識辨識）
# 敏感值全走 .env，此檔可安全 commit
# ============================================================

spring.config.import=optional:file:.env[.properties]

# ── 基本設定 ─────────────────────────────────────────────────
spring.application.name=halfaday
server.port=8080

# ── 檔案上傳限制 ─────────────────────────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ════════════════════════════════════════════════════════════
# 資料庫（PostgreSQL）
# ════════════════════════════════════════════════════════════
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/xiaobantian}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Boot 3.x + Hibernate 6 會自動偵測 dialect，不需手動設定

# 啟動時自動植入 data.sql 知識庫初始資料
# 第一次建立後建議改為 never 避免重複插入
spring.sql.init.mode=always

# ════════════════════════════════════════════════════════════
# Spring AI — PGVector 向量資料庫
# ════════════════════════════════════════════════════════════
spring.ai.vectorstore.type=pgvector
spring.ai.vectorstore.pgvector.initialize-schema=true
# 對應 embedding model 輸出維度
# paraphrase-multilingual-MiniLM-L12-v2 = 384
# text-embedding-3-large / 其他 1024 維模型 = 1024
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.schema-validation=false

# ════════════════════════════════════════════════════════════
# Spring AI — 聊天模型（xAI grok / OpenAI 相容介面）
# ════════════════════════════════════════════════════════════
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.x.ai}
spring.ai.openai.chat.options.model=${AI_CHAT_MODEL:grok-3-mini}

# ════════════════════════════════════════════════════════════
# 外部服務
# ════════════════════════════════════════════════════════════

# 中央氣象署開放資料
cwa.api.key=${CWA_API_KEY}
cwa.api.base-url=https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001

# Python 分析服務（聲音花特徵、影像分析）
python.analysis.base-url=${PYTHON_ANALYSIS_BASE_URL:http://localhost:8000}

# Python Embedding Service（YOLO 辨識後語意推薦）
embedding.service.base-url=${EMBEDDING_SERVICE_BASE_URL:http://localhost:8001}
embedding.service.enabled=true

# ── CORS（開發用，正式環境改為前端實際 origin） ──────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ════════════════════════════════════════════════════════════
# Feature Flags
# ════════════════════════════════════════════════════════════
feature.sound-flower.python-enabled=false

# ════════════════════════════════════════════════════════════
# JWT
# ════════════════════════════════════════════════════════════
jwt.secret=${JWT_SECRET:dev-secret-change-me-in-production}
jwt.expiration=86400000

# ════════════════════════════════════════════════════════════
# 日誌
# ════════════════════════════════════════════════════════════
logging.level.org.springframework.security=DEBUG
logging.level.com.xiaobantian=INFO